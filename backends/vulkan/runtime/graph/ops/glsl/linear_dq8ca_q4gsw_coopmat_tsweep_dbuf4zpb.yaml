# Intervention A: B LDS skew swept over {1 (baseline), 4 (power-of-two stride),
# 0 (no skew)} on top of zp-hoist + byte-parallel nibble widening, at the
# winning tile. Measured target is only 12 v_mul_lo_u32 (1.63% of the loop
# body) and it trades against an LDS category at 8.8%, so a regression is a
# plausible outcome.

linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4zpb:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    IO_STORAGE: buffer
    WEIGHT_NBITS: 4
    WEIGHT_STORAGE: texture2d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 128
    WG_TILE_N: 64
    WG_TILE_K: 32
    SG_GRID_X: 4
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 32
    B_SKEW: 1
  shader_variants:
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4zpb_t128x64k32g42s32sk4_buffer_texture2d_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      B_SKEW: 4
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4zpb_t128x64k32g42s32sk0_buffer_texture2d_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      B_SKEW: 0
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4zpb_t128x64k32g42s32sk1_buffer_texture2d_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      B_SKEW: 1
