# conv1d and conv1d_pw as a register-tiled GEMM with float32 accumulation
# (change conv2d-all-used-kernels). Reachable by a variant request
# (benchmark_v2 route simt) or a table row with ETVK_CONV2D_COOPMAT=1. Names:
# conv1d_simt_t<M>x<N>_m<TM>n<TN4>[_pw][_sk<slices>]_<dtype>. The variant list
# in impl/convolution/conv1d/Conv1dSimt.cpp must match.

conv1d_simt:
  parameter_names_with_default_values:
    PRECISION: highp
    DTYPE: float
    WG_TILE_M: 64
    WG_TILE_N: 16
    WG_TILE_K: 16
    TM: 4
    TN4: 1
    K_SLICES: 1
    PW: false
    MERGE: false
  generate_variant_forall:
    DTYPE:
      - VALUE: half
      - VALUE: float
  shader_variants:
    - NAME: conv1d_simt_merge
      MERGE: true
    - NAME: conv1d_simt_merge_pw
      MERGE: true
      PW: true
    - NAME: conv1d_simt_t64x16_m4n1
      WG_TILE_M: 64
      WG_TILE_N: 16
      WG_TILE_K: 16
      TM: 4
      TN4: 1
      K_SLICES: 1
    - NAME: conv1d_simt_t64x16_m4n1_sk4
      WG_TILE_M: 64
      WG_TILE_N: 16
      WG_TILE_K: 16
      TM: 4
      TN4: 1
      K_SLICES: 4
    - NAME: conv1d_simt_t64x16_m4n1_sk8
      WG_TILE_M: 64
      WG_TILE_N: 16
      WG_TILE_K: 16
      TM: 4
      TN4: 1
      K_SLICES: 8
    - NAME: conv1d_simt_t64x16_m4n1_sk16
      WG_TILE_M: 64
      WG_TILE_N: 16
      WG_TILE_K: 16
      TM: 4
      TN4: 1
      K_SLICES: 16
    - NAME: conv1d_simt_t32x32_m4n1
      WG_TILE_M: 32
      WG_TILE_N: 32
      WG_TILE_K: 16
      TM: 4
      TN4: 1
      K_SLICES: 1
    - NAME: conv1d_simt_t32x32_m4n1_sk4
      WG_TILE_M: 32
      WG_TILE_N: 32
      WG_TILE_K: 16
      TM: 4
      TN4: 1
      K_SLICES: 4
    - NAME: conv1d_simt_t32x32_m4n1_sk8
      WG_TILE_M: 32
      WG_TILE_N: 32
      WG_TILE_K: 16
      TM: 4
      TN4: 1
      K_SLICES: 8
    - NAME: conv1d_simt_t32x32_m4n1_sk16
