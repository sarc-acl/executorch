# INT8 convolution on int8 x int8 -> int32 cooperative matrices (change
# conv2d-all-used-kernels). Reachable by a variant request (benchmark_v2 routes
# pw_coopmat, im2col_coopmat) or a table row with ETVK_CONV2D_COOPMAT=1.
# Names: q8ta_conv2d_pw_coopmat_<family>_t<M>x<N>[_k<K>][_af][_rq][_dg|_dgb][_sk<slices>|_sa<slices>]
# (_af only with _dg).
# The variant list in impl/convolution/conv2d/q8ta/Q8taConv2dCoopmat.cpp must
# match.

q8ta_conv2d_pw_coopmat:
  parameter_names_with_default_values:
    VK_VERSION: '1.3'
    PRECISION: highp
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 32
    WG_TILE_N: 32
    WG_TILE_K: 32
    SG_GRID_X: 1
    SG_GRID_Y: 1
    SUBGROUP_SIZE: 32
    K_SLICES: 1
    DIRECT: false
    BYTES: false
    ATOMIC: false
    MERGE: false
    ASYNC: false
    REQUANT_ONCE: false
  shader_variants:
