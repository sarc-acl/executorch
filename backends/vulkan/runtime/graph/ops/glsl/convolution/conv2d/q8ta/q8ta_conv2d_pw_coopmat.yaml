      MMA_N: 16
      MMA_K: 32
      WG_TILE_M: 32
      WG_TILE_N: 32
      WG_TILE_K: 32
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 16
      K_SLICES: 1
