# FP16 1x1 convolution on cooperative matrices. Reachable only by a variant
# request (benchmark_v2 route pw_coopmat); automatic routing stays on
# conv2d_pw_tiled. Variant names: conv2d_pw_coopmat_<family>_t<M>x<N>_<acc>_half.
# The variant descriptors in impl/convolution/conv2d/Conv2dPW.cpp must match.

conv2d_pw_coopmat:
  parameter_names_with_default_values:
    # GL_KHR_cooperative_matrix requires SPIR-V 1.6.
    VK_VERSION: '1.3'
    PRECISION: highp
    DTYPE: half
    STORAGE: texture3d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 32
    WG_TILE_N: 64
    WG_TILE_K: 16
    SG_GRID_X: 2
    SG_GRID_Y: 1
    SUBGROUP_SIZE: 32
    ACC_TYPE: f16
    FRAG_LAYOUT: false
    DIAG_ONCE: false
    ALIGNED: false
    CLAMP_N: false
    ASYNC_A: false
    W16: false
    IMG_INPUT: false
    NO_EPILOGUE: false
    BCM: false
    DIRECT_B: false
    K_SLICES: 1
    I2C: false
    CHUNKED: false
    DIRECT: false
    SIMT: false
  shader_variants:
    # Intel Xe2 (Arc B580, Arc Pro B70): MMA 8x16x16, subgroup 16, K step 16,
    # fragment-contiguous shared memory. Subgroup grids: OUT/DEVICES.md rule
    # (halve the longer per-subgroup side until a subgroup owns <= 8 MMAs).
    - NAME: conv2d_pw_coopmat_xe2_t16x32_f16_half
      MMA_M: 8
      WG_TILE_M: 16
      WG_TILE_N: 32
      WG_TILE_K: 16
      SG_GRID_X: 1
      SG_GRID_Y: 1
      SUBGROUP_SIZE: 16
      ACC_TYPE: f16
      FRAG_LAYOUT: true
    - NAME: conv2d_pw_coopmat_xe2_t16x32_f32_half
      MMA_M: 8
      WG_TILE_M: 16
      WG_TILE_N: 32
      WG_TILE_K: 16
      SG_GRID_X: 1
      SG_GRID_Y: 1
      SUBGROUP_SIZE: 16
      ACC_TYPE: f32
      FRAG_LAYOUT: true
    - NAME: conv2d_pw_coopmat_xe2_t16x64_f16_half
      MMA_M: 8
      WG_TILE_M: 16
      WG_TILE_N: 64
      WG_TILE_K: 16
      SG_GRID_X: 1
      SG_GRID_Y: 1
      SUBGROUP_SIZE: 16
      ACC_TYPE: f16
      FRAG_LAYOUT: true
    - NAME: conv2d_pw_coopmat_xe2_t16x64_f32_half
      MMA_M: 8
      WG_TILE_M: 16
      WG_TILE_N: 64
      WG_TILE_K: 16
      SG_GRID_X: 1
      SG_GRID_Y: 1
      SUBGROUP_SIZE: 16
      ACC_TYPE: f32
      FRAG_LAYOUT: true
    - NAME: conv2d_pw_coopmat_xe2_t32x32_f16_half
      MMA_M: 8
      WG_TILE_M: 32
      WG_TILE_N: 32
      WG_TILE_K: 16
      SG_GRID_X: 1
      SG_GRID_Y: 1
      SUBGROUP_SIZE: 16
      ACC_TYPE: f16
      FRAG_LAYOUT: true
    - NAME: conv2d_pw_coopmat_xe2_t32x32_f32_half
      MMA_M: 8
