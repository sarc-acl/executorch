# FP16 1x1 convolution on cooperative matrices. Reachable only by a variant
# request (benchmark_v2 route pw_coopmat); automatic routing stays on
# conv2d_pw_tiled. Variant names: conv2d_pw_coopmat_<family>_t<M>x<N>_<acc>_half.
# The variant descriptors in impl/convolution/conv2d/Conv2dPW.cpp must match.

conv2d_pw_coopmat:
  parameter_names_with_default_values:
    # GL_KHR_cooperative_matrix requires SPIR-V 1.6.
    VK_VERSION: '1.3'
    PRECISION: highp
    DTYPE: half
    STORAGE: texture3d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 32
    WG_TILE_N: 64
    WG_TILE_K: 16
    SG_GRID_X: 2
    SG_GRID_Y: 1
    SUBGROUP_SIZE: 32
    ACC_TYPE: f16
    FRAG_LAYOUT: false
  shader_variants:
    # Intel Xe2 (Arc B580, Arc Pro B70): MMA 8x16x16, subgroup 16,
    # fragment-contiguous shared memory, K step 16.
    - NAME: conv2d_pw_coopmat_xe2_t32x64_f16_half
      MMA_M: 8
      WG_TILE_M: 32
      WG_TILE_N: 64
      WG_TILE_K: 16
      SG_GRID_X: 2
      SG_GRID_Y: 1
      SUBGROUP_SIZE: 16
      FRAG_LAYOUT: true
