pack_conv2d_gemm_weight:
  parameter_names_with_default_values:
    DTYPE: float
    BUF_DTYPE: float
    PACKED_STORAGE: texture2d
    PAD_K: false
  generate_variant_forall:
    combination:
      parameter_names: [PACKED_STORAGE, DTYPE, BUF_DTYPE]
      combos:
        - parameter_values: [texture2d, float, float]
        - parameter_values: [texture2d, half, half]
        - parameter_values: [texture2d, half, float]
        # Buffer weights for the cooperative-matrix multiply of route
        # im2col_coopmat.
        - parameter_values: [buffer, half, half]
        - parameter_values: [buffer, half, float]
        # Buffer weights of the FP32 conv2d_simt variants.
        - parameter_values: [buffer, float, float]
  shader_variants:
    - NAME: pack_conv2d_gemm_weight
    # Zero rows after the weights up to dims1.z (route direct_coopmat).
    - NAME: pack_conv2d_gemm_weight_padk
      PAD_K: true
