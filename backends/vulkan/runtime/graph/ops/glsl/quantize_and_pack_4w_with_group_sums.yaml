# Row-major (kPackedInt8_4W) counterpart of
# quantize_and_pack_4h4w_with_group_sums. Same quantization, same per-group
# sum reduction, same workgroup shapes -- only the output layout differs.
# Consumed exclusively by linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4tr, whose
# coopmat-staged A path needs a row-major int8 activation buffer that a
# coopMatLoad can address. Buffer output only.
#
# The variant matrix mirrors the 4h4w yaml minus the buffer-output-only
# restriction, so pick_quantize_and_pack_4w_with_group_sums_shader() can build
# the same name suffixes (_o2w32/_o4w16 + storage + dtype + zp mode).

quantize_and_pack_4w_with_group_sums:
  parameter_names_with_default_values:
    DTYPE: float
    OUTPUT_STORAGE: buffer
    INPUT_STORAGE: texture3d
    NUM_GROUPS_PER_WG: 2
    NUM_WORKERS_PER_GROUP: 32
    ZP_DTYPE_MODE: zpint8
  generate_variant_forall:
    DTYPE:
      - VALUE: half
      - VALUE: float
    ZP_DTYPE_MODE:
      - VALUE: zpint8
      - VALUE: zpinherit
  shader_variants:
    - NAME: quantize_and_pack_4w_with_group_sums_o2w32_buffer_texture3d
    - NAME: quantize_and_pack_4w_with_group_sums_o2w32_buffer_buffer
      OUTPUT_STORAGE: buffer
      INPUT_STORAGE: buffer
    - NAME: quantize_and_pack_4w_with_group_sums_o4w16_buffer_texture3d
      NUM_GROUPS_PER_WG: 4
      NUM_WORKERS_PER_GROUP: 16
    - NAME: quantize_and_pack_4w_with_group_sums_o4w16_buffer_buffer
      NUM_GROUPS_PER_WG: 4
      NUM_WORKERS_PER_GROUP: 16
      OUTPUT_STORAGE: buffer
      INPUT_STORAGE: buffer
