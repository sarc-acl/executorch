# coopmat variant of the weight-only int4 quantized linear tiled shader (fp16
# act x INT4 weight, dequantized to fp16 at the shared-memory store).
#   WEIGHT_NBITS=4 -> linear_q4gsw_coopmat (INT4 group-symmetric)
# IO_STORAGE selects activation/output storage: "buffer" uses coopMatLoad/
# Store directly on an SSBO; "texture3d" stages the result tile through
# shared memory before an imageStore (coopMatStore can only target a buffer).
# INT weight storage can be texture2d or buffer (matches the tiled path).
# DTYPE = half only; fp32 activations are not supported.
# Geometry follows the double-buffered "dbuf4" reference: 128x128 tile,
# K-step 16, 2x2 subgroup grid x 32 threads (subgroup size 32 forced). This
# geometry was tuned for AMD-RDNA GPUs. NOTE: the C++ dispatch in
# QuantizedLinear.cpp must keep kQ4gswCoopmatDims.n and .wg_size in sync with
# WG_TILE_N (128) and WG_SIZE (= SG_GRID_X*SG_GRID_Y*SUBGROUP = 128).

linear_qw_coopmat:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    IO_STORAGE: buffer
    WEIGHT_NBITS: 4
    WEIGHT_STORAGE: texture2d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 128
    WG_TILE_N: 128
    WG_TILE_K: 16
    SG_GRID_X: 2
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 32
  shader_variants:
    - NAME: linear_q4gsw_coopmat_buffer_texture2d_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
    - NAME: linear_q4gsw_coopmat_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
    - NAME: linear_q4gsw_coopmat_buffer_buffer_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: buffer
