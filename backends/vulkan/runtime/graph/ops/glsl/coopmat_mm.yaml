# Unified KHR Cooperative Matrix MM kernel (linear + matmul).
# Three shader variants over two weight layouts:
#   matmul_coopmat       row_major weight, no bias  (aten.mm runtime mat2)
#   linear_coopmat       prepacked weight, no bias  (aten.linear)
#   linear_coopmat_bias  prepacked weight, +bias    (aten.linear with bias)

coopmat_mm:
  parameter_names_with_default_values:
    DTYPE: float
    PRECISION: highp
    WEIGHT_LAYOUT: row_major
    HAS_BIAS: false
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 64
    WG_TILE_N: 64
    WG_TILE_K: 32
    SG_GRID_X: 2
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 64
  generate_variant_forall:
    DTYPE:
      - VALUE: float
      - VALUE: half
  shader_variants:
    - NAME: matmul_coopmat
      WEIGHT_LAYOUT: row_major
    - NAME: linear_coopmat
      WEIGHT_LAYOUT: prepacked
    - NAME: linear_coopmat_bias
      WEIGHT_LAYOUT: prepacked
      HAS_BIAS: true
    # ── Tile-geometry sweep variants for the SDPA attention matmul shapes.
    # Only the row_major matmul path is swept; the staging is grid-stride
    # multi-pass so each geometry is internally consistent (the per-variant
    # WG_SIZE = SG_GRID_X*SG_GRID_Y*SUBGROUP_SIZE must be launched by the C++
    # dispatch — see coopmat_tile_dims() in GemmCoopmat.cpp).
    - NAME: matmul_coopmat_t64x64x32
      WEIGHT_LAYOUT: row_major
      WG_TILE_M: 64
      WG_TILE_N: 64
      WG_TILE_K: 32
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 64
    - NAME: matmul_coopmat_t128x64x32
      WEIGHT_LAYOUT: row_major
      WG_TILE_M: 128
      WG_TILE_N: 64
      WG_TILE_K: 32
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 64
    - NAME: matmul_coopmat_t64x128x32
      WEIGHT_LAYOUT: row_major
      WG_TILE_M: 64
      WG_TILE_N: 128
      WG_TILE_K: 32
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 64
    - NAME: matmul_coopmat_t128x128x32
      WEIGHT_LAYOUT: row_major
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 32
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 64
    - NAME: matmul_coopmat_t128x64x16
      WEIGHT_LAYOUT: row_major
      WG_TILE_M: 128
      WG_TILE_N: 64
      WG_TILE_K: 16
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
