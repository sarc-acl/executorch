# "zp-hoisted" variants of the int8 dq8ca_q4gsw coopmat kernel: identical to
# tsweep_dbuf4 except the activation zero-point correction and the per-row
# activation scale are applied once after the group loop instead of once per
# quantization group. No new binding, no export-format change -- the weight-side
# correction sum is derived in the prologue from tensors already bound.
#
# Selected via
# ET_VK_DQ8CA_COOPMAT_VARIANT=tsweep_dbuf4zpg_t<M>x<N>k<K>g<SGX><SGY>s<sub>.
# Shipped 8da4w default on the 780M (RDNA3 / RADV) since 2026-09-16: 2456 tok/s
# vs 2190 tok/s for zpgtr on 1B embq 2048-prefill, token-checked. Trimmed to the
# one shipped tile; the full sweep set is on the -archived-2026-09-15 branch.

linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4zpg:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    IO_STORAGE: buffer
    WEIGHT_NBITS: 4
    WEIGHT_STORAGE: texture2d
    A_MAP_FULL: false
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 64
    WG_TILE_N: 32
    WG_TILE_K: 32
    SG_GRID_X: 1
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 64
  shader_variants:
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4zpg_t128x64k32g42s32_buffer_texture2d_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 64
      WG_TILE_K: 32
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
      # A_ACTIVE_THREADS = (128>>2)*(32>>2) = 256 == WG_SIZE = 4*2*32 = 256
      A_MAP_FULL: true
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4zpg_t128x64k32g42s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 64
      WG_TILE_K: 32
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
      # A_ACTIVE_THREADS = (128>>2)*(32>>2) = 256 == WG_SIZE = 4*2*32 = 256
      A_MAP_FULL: true
