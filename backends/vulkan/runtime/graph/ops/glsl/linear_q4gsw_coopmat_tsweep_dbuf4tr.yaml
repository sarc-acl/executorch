# "-tr" (coopmat-staged A) port of linear_q4gsw_coopmat_tsweep_dbuf4 --
# coopMatLoad(t_input) -> coopMatStore(Ash) instead of the per-thread scalar
# scatter, buffer storage only (texture3d keeps dbuf4's original A-staging
# unchanged -- see this shader's own header for why). Selected via
# ET_VK_Q4GSW_COOPMAT_VARIANT=tsweep_dbuf4tr_t<M>x<N>k<K>g<SGX><SGY>s<sub>.
# NOT the shipped default -- see
# openspec/changes/coopmat-tr-tilesweep-4w-port.
#
# Single seed tile: the current shipped 4w default's own tile
# (t128x128k16g22s32), for a like-for-like A-staging-only comparison. A
# fresh tile re-sweep is a planned follow-up (design.md section 4), not in
# this file.

linear_q4gsw_coopmat_tsweep_dbuf4tr:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    IO_STORAGE: buffer
    WEIGHT_STORAGE: texture2d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 128
    WG_TILE_N: 128
    WG_TILE_K: 16
    SG_GRID_X: 2
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 32
  shader_variants:
    - NAME: linear_q4gsw_coopmat_tsweep_dbuf4tr_t128x128k16g22s32_buffer_texture2d_half
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 16
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    - NAME: linear_q4gsw_coopmat_tsweep_dbuf4tr_t128x128k16g22s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 16
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
