# "-tr" (coopmat-staged A) variants of the int8 dq8ca_q4gsw coopmat kernel,
# ported from shmem_double_buf4-tr.comp (vk_cooperative_matrix_perf,
# gemm-ubm). linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4trm.glsl is a fork of
# linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4.glsl with ONLY the A-side global ->
# LDS staging swapped from a per-thread ivec4 copy to
# coopMatLoad(global) -> coopmat<> -> coopMatStore(LDS). B staging is
# byte-identical (int4 nibble unpack cannot be coopmat-staged) and B was
# already column-major in LDS, so it is not a delta.
#
# These variants require t_packed_int8_input in the ROW-MAJOR
# kPackedInt8_4W layout (produced by quantize_and_pack_4w_with_group_sums),
# NOT the stock 4h4w block layout. QuantizedLinear.cpp switches the tensor
# layout and the packer node together with the variant token, and only when
# the coopmat gate passes -- see dq8ca_wants_rowmajor_int8_input().
#
# Selected via
# ET_VK_DQ8CA_COOPMAT_VARIANT=tsweep_dbuf4trm_t<M>x<N>k<K>g<SGX><SGY>s<sub>.
# NOT the shipped default: unvalidated until it passes repeated
# test_llama_microbench --correctness-only runs (a single pass is not proof --
# see dq8ca_coopmat_variant()'s comment).
#
# Tile-geometry preconditions beyond dbuf4's: WG_TILE_M % MMA_M == 0 and
# WG_TILE_K % MMA_K == 0 (both hold for every entry below). The seed set is
# deliberately small -- widen it from a sweep once correctness is established.

linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4trm:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    IO_STORAGE: buffer
    WEIGHT_NBITS: 4
    WEIGHT_STORAGE: texture2d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 64
    WG_TILE_N: 32
    WG_TILE_K: 32
    SG_GRID_X: 1
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 64
  shader_variants:
    # production 8da4w tile (dbuf2/dbuf4 default) -- the A/B anchor
    #   A tiles/chunk = 8, subgroups = 2 -> A_TILES_PER_SG = 4
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4trm_t64x32k32g12s64_buffer_texture2d_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 64
      WG_TILE_N: 32
      WG_TILE_K: 32
      SG_GRID_X: 1
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 64
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4trm_t64x32k32g12s64_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 64
      WG_TILE_N: 32
      WG_TILE_K: 32
      SG_GRID_X: 1
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 64
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4trm_t64x32k32g12s64_buffer_buffer_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: buffer
      WG_TILE_M: 64
      WG_TILE_N: 32
      WG_TILE_K: 32
      SG_GRID_X: 1
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 64
    # q4gsw production geometry; 8 A-tiles over 4 subgroups
    #   A tiles/chunk = 8, subgroups = 4 -> A_TILES_PER_SG = 2
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4trm_t128x128k16g22s32_buffer_texture2d_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 16
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4trm_t128x128k16g22s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 16
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    # 1 A-tile per subgroup (A_TILES_PER_SG == 1, no leftover slot)
    #   A tiles/chunk = 8, subgroups = 8 -> A_TILES_PER_SG = 1
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4trm_t64x64k32g24s32_buffer_texture2d_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 64
      WG_TILE_N: 64
      WG_TILE_K: 32
      SG_GRID_X: 2
      SG_GRID_Y: 4
      SUBGROUP_SIZE: 32
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4trm_t64x64k32g24s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 64
      WG_TILE_N: 64
      WG_TILE_K: 32
      SG_GRID_X: 2
      SG_GRID_Y: 4
      SUBGROUP_SIZE: 32
    # 16 A-tiles over 8 subgroups
    #   A tiles/chunk = 16, subgroups = 8 -> A_TILES_PER_SG = 2
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4trm_t128x64k32g24s32_buffer_texture2d_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 64
      WG_TILE_K: 32
      SG_GRID_X: 2
      SG_GRID_Y: 4
      SUBGROUP_SIZE: 32
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4trm_t128x64k32g24s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 64
      WG_TILE_K: 32
      SG_GRID_X: 2
      SG_GRID_Y: 4
      SUBGROUP_SIZE: 32
    # Reference-matching tile: shmem_double_buf4-tr.comp's own geometry
    # (TILE 128x128x16, WORKGROUP_WIDTH_IN_SUBGROUPS=4 x DBUF4_GRID_HEIGHT=2,
    # wave32) => 8 subgroups / 256 threads, MMAS_PER_SG 4x2. Added so our
    # kernel can be A/B'd against the teammate's PAL capture at the same
    # tile and the same 2048x1024x4096 shape (8b wk_wv prefill).
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4trm_t128x128k16g42s32_buffer_texture2d_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 16
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4trm_t128x128k16g42s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 16
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    # G2/Pavan's documented INT8 uBM config: TILE 128x128x64 with a 4x2
    # subgroup grid at wave32 (workgroupSize=256). Added to compare our kernel
    # against their reference dbuf4 number (~1973us) at the same geometry and
    # the same shape (M2048 K4096 N1024 == 8b wk_wv prefill).
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4trm_t128x128k64g42s32_buffer_texture2d_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 64
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4trm_t128x128k64g42s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 64
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
