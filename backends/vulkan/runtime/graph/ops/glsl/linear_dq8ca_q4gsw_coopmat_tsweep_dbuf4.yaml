# specs/041-dbuf4-tile-sweep: TILE/SUBGROUP SWEEP variants of the int8
# dq8ca_q4gsw coopmat shader's dbuf4 loop structure (the ORIGINAL loop before
# specs/025 User Story 1 picked dbuf2) --
# linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4.glsl is a fork of
# linear_dq8ca_q4gsw_coopmat_tsweep.glsl (dbuf2) with only the loop structure
# swapped. Only tile geometry (WG_TILE_*, SG_GRID_*, SUBGROUP_SIZE) varies
# per variant. Selected via
# ET_VK_DQ8CA_COOPMAT_VARIANT=tsweep_dbuf4_t<M>x<N>k<K>g<SGX><SGY>s<sub>.
# Seed variant below matches the current production 8da4w tile (dbuf2,
# specs/026/027) as a legal, known-fast starting point for sweep.py's
# Optuna search; specs/041's sweep appends further candidates here as it
# runs.

