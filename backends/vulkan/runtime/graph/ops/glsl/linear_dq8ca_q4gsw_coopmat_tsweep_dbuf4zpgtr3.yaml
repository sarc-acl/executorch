# "zpgtr3": dbuf4zpgtr with tr3's SHARED-A layout. Three changes vs zpgtr, all
# on the A path only:
#   1. shared storage element type uint (4x int8 packed) -> scalar int8_t
#   2. slab-major (one MMA_K-wide slab per K step) -> row-major over the FULL
#      chunk (WG_TILE_K wide)
#   3. A_ROW_PAD_I8 bytes of padding on each FULL-CHUNK row (tr3 uses 16)
# B staging, zp-hoist, byte-parallel nibble widening, the group/chunk nesting,
# the memoryBarrierShared fences and the fp16 output path are dbuf4zpgtr's,
# byte-for-byte unchanged.
#
# OPT-IN ONLY -- not a default. Select with
#   ET_VK_DQ8CA_COOPMAT_VARIANT=tsweep_dbuf4zpgtr3_t<M>x<N>k<K>g<GX><GY>s<sub>p<pad>
#
# LDS cost of the A array is 2*WG_TILE_M*(WG_TILE_K+A_ROW_PAD_I8) bytes, i.e.
# padding is paid once per row, NOT once per MMA_K slab row. At
# t128x64k32g42s32 that is p0 8192 B / p8 10240 B / p16 12288 B against
# zpgtr's 8192 B, so p16 adds 4 KiB and is the only one of the three that can
# cost a workgroup of LDS-limited occupancy.

linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4zpgtr3:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    IO_STORAGE: buffer
    WEIGHT_NBITS: 4
    WEIGHT_STORAGE: texture2d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 64
    WG_TILE_N: 32
    WG_TILE_K: 32
    SG_GRID_X: 1
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 64
    A_ROW_PAD_I8: 16
  shader_variants:
    # --- shipped geometry, pad swept: isolates padding from layout+element type
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4zpgtr3_t128x64k32g42s32p16_buffer_texture2d_half
      WG_TILE_M: 128
      WG_TILE_N: 64
      WG_TILE_K: 32
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
      A_ROW_PAD_I8: 16
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4zpgtr3_t128x64k32g42s32p8_buffer_texture2d_half
      WG_TILE_M: 128
      WG_TILE_N: 64
      WG_TILE_K: 32
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
      A_ROW_PAD_I8: 8
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4zpgtr3_t128x64k32g42s32p0_buffer_texture2d_half
      WG_TILE_M: 128
      WG_TILE_N: 64
      WG_TILE_K: 32
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
      A_ROW_PAD_I8: 0
    # --- iso geometry (the config TR3 was measured at) with tr3's own pad
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4zpgtr3_t128x128k32g42s32p16_buffer_texture2d_half
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 32
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
      A_ROW_PAD_I8: 16
    # --- texture-IO coverage at the shipped geometry (storage-variant parity)
    - NAME: linear_dq8ca_q4gsw_coopmat_tsweep_dbuf4zpgtr3_t128x64k32g42s32p16_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WG_TILE_M: 128
      WG_TILE_N: 64
      WG_TILE_K: 32
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
      A_ROW_PAD_I8: 16
    # NOTE on the INT8 weight path: the baseline dbuf4zpgtr yaml ships no
    # WEIGHT_NBITS=8 variant either, and the host builds kernel names as
    # <base>_<io>_<weight>_half with no nbits field, so a w8 entry would be
    # unreachable. The `#else` (INT8) branch of the shader is untouched by this
    # change; it is simply not compiled, exactly as in the baseline.
