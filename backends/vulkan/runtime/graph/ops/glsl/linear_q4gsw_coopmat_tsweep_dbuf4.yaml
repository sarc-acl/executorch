# linear_q4gsw_coopmat_tsweep_dbuf4.glsl is the fp16 q4gsw coopmat kernel's
# dbuf4 ("store-first", prefetch-peeled) loop structure. Tile geometry
# (WG_TILE_*, SG_GRID_*, SUBGROUP_SIZE) is selectable at dispatch via
# ET_VK_Q4GSW_COOPMAT_VARIANT=tsweep_dbuf4_t<M>x<N>k<K>g<SGX><SGY>s<sub>
# (QuantizedLinear.cpp), but t128x128k16g22s32 below is the only tile this
# branch ships or builds -- it is the current production 4w default.
#
# 2026-09-15 housekeeping: this file carried the full specs/041-dbuf4-
# tile-sweep search space (97 variants across ~48 tile geometries) even
# though only this one tile is ever dispatched. Trimmed to the 3 storage
# combos of the shipped tile. Full sweep history (every candidate tried,
# measured deltas) preserved on branch
# yanwen/release14-quant-shaders-archived-2026-09-15.

linear_q4gsw_coopmat_tsweep_dbuf4:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    IO_STORAGE: buffer
    WEIGHT_STORAGE: texture2d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 128
    WG_TILE_N: 128
    WG_TILE_K: 16
    SG_GRID_X: 2
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 32
  shader_variants:
    - NAME: linear_q4gsw_coopmat_tsweep_dbuf4_t128x128k16g22s32_buffer_texture2d_half
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 16
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    - NAME: linear_q4gsw_coopmat_tsweep_dbuf4_t128x128k16g22s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 16
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    - NAME: linear_q4gsw_coopmat_tsweep_dbuf4_t128x128k16g22s32_buffer_buffer_half
      WEIGHT_STORAGE: buffer
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 16
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    # Independently validated 2048-token prefill winner.
    - NAME: linear_q4gsw_coopmat_tsweep_dbuf4_t128x256k16g41s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 256
      WG_TILE_K: 16
      SG_GRID_X: 4
      SG_GRID_Y: 1
      SUBGROUP_SIZE: 32
    # Independently validated 2048-token prefill winner.
    - NAME: linear_q4gsw_coopmat_tsweep_dbuf4_t256x128k16g22s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 256
      WG_TILE_N: 128
      WG_TILE_K: 16
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
