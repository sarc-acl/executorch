# specs/041-dbuf4-tile-sweep: TILE-SIZE SWEEP variants of the fp16 q4gsw
# coopmat kernel's dbuf4 ("store-first", prefetch-peeled) loop structure --
# linear_q4gsw_coopmat_tsweep_dbuf4.glsl is a fork of
# linear_q4gsw_coopmat_tsweep.glsl (dbuf1) with only the loop structure
# swapped. Only the tile geometry (WG_TILE_*, SG_GRID_*, SUBGROUP_SIZE)
# varies per variant. Selected at dispatch via
# ET_VK_Q4GSW_COOPMAT_VARIANT=tsweep_dbuf4_t<M>x<N>k<K>g<SGX><SGY>s<sub>
# (QuantizedLinear.cpp). Seed variant below matches the current production
# 4w tile (dbuf1, specs/036) as a legal, known-fast starting point for
# sweep.py's Optuna search; specs/041's sweep appends further candidates
# here as it runs.

linear_q4gsw_coopmat_tsweep_dbuf4:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    IO_STORAGE: buffer
    WEIGHT_STORAGE: texture2d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 128
    WG_TILE_N: 128
    WG_TILE_K: 16
    SG_GRID_X: 2
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 32
