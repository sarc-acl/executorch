# linear_q4gsw_coopmat_tsweep_dbuf4.glsl is the fp16 q4gsw coopmat kernel's
# dbuf4 ("store-first", prefetch-peeled) loop structure. Tile geometry
# (WG_TILE_*, SG_GRID_*, SUBGROUP_SIZE) is selectable at dispatch via
# ET_VK_Q4GSW_COOPMAT_VARIANT=tsweep_dbuf4_t<M>x<N>k<K>g<SGX><SGY>s<sub>
# (QuantizedLinear.cpp), but t128x128k16g22s32 below is the only tile this
# branch ships or builds -- it is the current production 4w default.
#
# 2026-09-15 housekeeping: this file carried the full specs/041-dbuf4-
# tile-sweep search space (97 variants across ~48 tile geometries) even
# though only this one tile is ever dispatched. Trimmed to the 3 storage
# combos of the shipped tile. Full sweep history (every candidate tried,
# measured deltas) preserved on branch
# yanwen/release14-quant-shaders-archived-2026-09-15.

linear_q4gsw_coopmat_tsweep_dbuf4:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    IO_STORAGE: buffer
    WEIGHT_STORAGE: texture2d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 128
    WG_TILE_N: 128
    WG_TILE_K: 16
    SG_GRID_X: 2
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 32
    SH_F16V4: false
  shader_variants:
    - NAME: linear_q4gsw_coopmat_tsweep_dbuf4_t128x128k16g22s32_buffer_texture2d_half
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 16
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    - NAME: linear_q4gsw_coopmat_tsweep_dbuf4_t128x128k16g22s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 16
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    - NAME: linear_q4gsw_coopmat_tsweep_dbuf4_t128x128k16g22s32_buffer_buffer_half
      WEIGHT_STORAGE: buffer
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 16
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    # Arm Mali-G1 (subgroup 16; fp16 MMA only at 16x32x32 / 4x8x8). 64x64x32
    # WG tile, 2x2 subgroups x 16 = 64 threads; SG tile 32x32 = 2x1 MMAs.
    # Shared: Ash 2*64*5 + Bsh 2*32*9 uvec4 = 19.5 KB (+4 KB Csh at texture
    # IO), under Mali's 32 KB. The "m16x32x32" token suffix carries the MMA
    # shape to the C++ dispatch gate.
    - NAME: linear_q4gsw_coopmat_tsweep_dbuf4_t64x64k32g22s16m16x32x32_buffer_texture2d_half
      WEIGHT_STORAGE: texture2d
      MMA_M: 16
      MMA_N: 32
      MMA_K: 32
      WG_TILE_M: 64
      WG_TILE_N: 64
      WG_TILE_K: 32
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 16
      SH_F16V4: true
    - NAME: linear_q4gsw_coopmat_tsweep_dbuf4_t64x64k32g22s16m16x32x32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_STORAGE: texture2d
      MMA_M: 16
      MMA_N: 32
      MMA_K: 32
      WG_TILE_M: 64
      WG_TILE_N: 64
      WG_TILE_K: 32
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 16
      SH_F16V4: true
    - NAME: linear_q4gsw_coopmat_tsweep_dbuf4_t64x64k32g22s16m16x32x32_buffer_buffer_half
      WEIGHT_STORAGE: buffer
      MMA_M: 16
      MMA_N: 32
      MMA_K: 32
      WG_TILE_M: 64
      WG_TILE_N: 64
      WG_TILE_K: 32
      SG_GRID_X: 2
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 16
      SH_F16V4: true
    # Mali-G1 sweep candidates (texture3d IO only; select via ET_VK_Q4GSW_COOPMAT_VARIANT)
