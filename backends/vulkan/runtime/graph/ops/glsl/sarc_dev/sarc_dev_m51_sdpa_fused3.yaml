# SARC development zone, M51: the 780M's fused LLM-mode prefill SDPA kernel (sarc_dev_780m_sdpa_fused3.yaml) with
# subgroup control barriers at its shared-memory exchanges (not shipped; reached only through
# ET_VK_SARC_M51_PROFILE, impl/sarc_dev/m51/SdpaM51Fused.cpp). Only the packed one-pass form (rko) is built.
# Name: d<HEAD_DIM>_t<WG_TILE_M>x<WG_TILE_N>g11s<SUBGROUP_SIZE>rko. Each variant needs WG_TILE_M 16 or 32 and
# WG_TILE_N / (SUBGROUP_SIZE / WG_TILE_M) a multiple of 8.

sarc_dev_m51_sdpa_fused3:
  parameter_names_with_default_values:
    DTYPE: half
    PRECISION: highp
    IO_STORAGE: buffer
    K_CACHE_STORAGE: buffer
    HEAD_DIM: 64
    WG_TILE_M: 32
    WG_TILE_N: 32
    SUBGROUP_SIZE: 32
    AQ_REG: true
    PACKED: true
    ONLINE: true
    ONE_PASS_WRONG: false
  generate_variant_forall:
    combination:
      parameter_names: [IO_STORAGE, K_CACHE_STORAGE]
      combos:
        - parameter_values: [buffer, buffer]
    DTYPE:
      - VALUE: half
  shader_variants:
    - NAME: sarc_dev_m51_sdpa_fused3_d64_t32x32g11s32rko
      HEAD_DIM: 64
      WG_TILE_M: 32
      WG_TILE_N: 32
      SUBGROUP_SIZE: 32
    - NAME: sarc_dev_m51_sdpa_fused3_d64_t16x32g11s32rko
      HEAD_DIM: 64
      WG_TILE_M: 16
      WG_TILE_N: 32
      SUBGROUP_SIZE: 32
    - NAME: sarc_dev_m51_sdpa_fused3_d64_t32x64g11s32rko
      HEAD_DIM: 64
      WG_TILE_M: 32
      WG_TILE_N: 64
      SUBGROUP_SIZE: 32
    - NAME: sarc_dev_m51_sdpa_fused3_d64_t32x32g11s64rko
      HEAD_DIM: 64
      WG_TILE_M: 32
      WG_TILE_N: 32
      SUBGROUP_SIZE: 64
    - NAME: sarc_dev_m51_sdpa_fused3_d64_t32x64g11s64rko
      HEAD_DIM: 64
      WG_TILE_M: 32
      WG_TILE_N: 64
      SUBGROUP_SIZE: 64
    - NAME: sarc_dev_m51_sdpa_fused3_d64_t16x64g11s64rko
      HEAD_DIM: 64
      WG_TILE_M: 16
      WG_TILE_N: 64
      SUBGROUP_SIZE: 64
    - NAME: sarc_dev_m51_sdpa_fused3_d128_t16x64g11s32rko
      HEAD_DIM: 128
      WG_TILE_M: 16
      WG_TILE_N: 64
      SUBGROUP_SIZE: 32
    - NAME: sarc_dev_m51_sdpa_fused3_d128_t16x32g11s32rko
      HEAD_DIM: 128
      WG_TILE_M: 16
      WG_TILE_N: 32
      SUBGROUP_SIZE: 32
    - NAME: sarc_dev_m51_sdpa_fused3_d128_t32x32g11s32rko
      HEAD_DIM: 128
      WG_TILE_M: 32
      WG_TILE_N: 32
      SUBGROUP_SIZE: 32
    - NAME: sarc_dev_m51_sdpa_fused3_d128_t16x64g11s64rko
      HEAD_DIM: 128
      WG_TILE_M: 16
      WG_TILE_N: 64
      SUBGROUP_SIZE: 64
    - NAME: sarc_dev_m51_sdpa_fused3_d128_t32x32g11s64rko
      HEAD_DIM: 128
      WG_TILE_M: 32
      WG_TILE_N: 32
      SUBGROUP_SIZE: 64
    - NAME: sarc_dev_m51_sdpa_fused3_d128_t32x64g11s64rko
      HEAD_DIM: 128
      WG_TILE_M: 32
      WG_TILE_N: 64
      SUBGROUP_SIZE: 64
