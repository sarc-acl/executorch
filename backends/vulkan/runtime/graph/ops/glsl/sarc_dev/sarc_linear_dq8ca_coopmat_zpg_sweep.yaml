# SARC development zone: zpg sweep candidates (the 1.4 B580 branch per-shape Xe2 tiles).


sarc_linear_dq8ca_coopmat_zpg_sweep:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    IO_STORAGE: buffer
    WEIGHT_NBITS: 4
    WEIGHT_STORAGE: texture2d
    A_MAP_FULL: false
    A_MULTI_BLOCK: false
    A_BLOCKS: 1
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 128
    WG_TILE_N: 64
    WG_TILE_K: 32
    SG_GRID_X: 4
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 32
  shader_variants:
    - NAME: sarc_linear_dq8ca_coopmat_zpg_sweep_t128x64k64g48s32m8_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WG_TILE_K: 64
      SG_GRID_X: 4
      SG_GRID_Y: 8
      MMA_M: 8
      MMA_K: 32
      A_MULTI_BLOCK: true
    - NAME: sarc_linear_dq8ca_coopmat_zpg_sweep_t128x128k32g48s32m8_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WG_TILE_N: 128
      SG_GRID_X: 4
      SG_GRID_Y: 8
      MMA_M: 8
      MMA_K: 32
      A_MULTI_BLOCK: true
    # RX 7600 2026-09-28: RDNA 16x16x16 int8 tiles with larger per-subgroup tiles than the
    # 780M t128x64k32g42s32 (64x16), for more int8 WMMA work per loaded LDS byte. A tile with
    # (WG_TILE_M / 4) * (WG_TILE_K / 4) = 2 * WG_SIZE A blocks needs A_MULTI_BLOCK, A_BLOCKS: 2.
    - NAME: sarc_linear_dq8ca_coopmat_zpg_sweep_t128x128k32g42s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WG_TILE_N: 128
      A_MAP_FULL: true
    - NAME: sarc_linear_dq8ca_coopmat_zpg_sweep_t128x128k32g24s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WG_TILE_N: 128
      SG_GRID_X: 2
      SG_GRID_Y: 4
      A_MAP_FULL: true
    - NAME: sarc_linear_dq8ca_coopmat_zpg_sweep_t256x64k32g24s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WG_TILE_M: 256
      SG_GRID_X: 2
      SG_GRID_Y: 4
      A_MAP_FULL: true
      A_MULTI_BLOCK: true
      A_BLOCKS: 2
    - NAME: sarc_linear_dq8ca_coopmat_zpg_sweep_t128x64k32g22s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      SG_GRID_X: 2
      SG_GRID_Y: 2
      A_MAP_FULL: true
      A_MULTI_BLOCK: true
      A_BLOCKS: 2
