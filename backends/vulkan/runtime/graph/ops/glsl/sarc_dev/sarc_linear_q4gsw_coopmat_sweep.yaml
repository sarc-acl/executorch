    # 16x32x32 (fp16 or fp32 acc) and 4x8x8, 32 KiB shared memory. LDS per variant (bytes):
    # 2 * 16 * (M * (K + 8) / 8 + K * (N + 8) / 8), plus SG_GRID_Y * 16 * N * 2 for the
    # texture3d drain (Csh); a storage combination is built only where the total stays < 32768.
