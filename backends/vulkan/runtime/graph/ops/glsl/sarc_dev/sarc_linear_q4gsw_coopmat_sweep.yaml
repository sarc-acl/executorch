# SARC development zone: q4gsw coopmat sweep candidates (not shipped).
# Select one at run time with ET_VK_SARC_Q4GSW_VARIANT=<tile token>, e.g.
# t128x128k32g24s32f32c (see impl/sarc_dev/Overrides.cpp). Names are
# sarc_linear_q4gsw_coopmat_sweep_<tile>_<io>_<weight>_half.
# Seeded from the 1.4 780M branch (yanwen/release14-quant-shaders-780m e4786474b9).

sarc_linear_q4gsw_coopmat_sweep:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    IO_STORAGE: buffer
    WEIGHT_STORAGE: texture2d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 128
    WG_TILE_N: 128
    WG_TILE_K: 16
    SG_GRID_X: 2
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 32
    ACC_FP32: false
    CSH_IN_ASH: false
    ACC_GROUP_FP32: false
    FRAG_LAYOUT: false
    IMG_A: false
    IMG_W: false
    SH_F16V4: false
    B_COLMAJOR: false
  shader_variants:
    - NAME: sarc_linear_q4gsw_coopmat_sweep_t128x128k32g42s32_buffer_texture2d_half
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 32
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    - NAME: sarc_linear_q4gsw_coopmat_sweep_t128x128k32g42s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 32
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    - NAME: sarc_linear_q4gsw_coopmat_sweep_t128x128k32g42s32_buffer_buffer_half
      WEIGHT_STORAGE: buffer
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 32
      SG_GRID_X: 4
      SG_GRID_Y: 2
      SUBGROUP_SIZE: 32
    - NAME: sarc_linear_q4gsw_coopmat_sweep_t128x128k32g24s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_STORAGE: texture2d
      WG_TILE_M: 128
      WG_TILE_N: 128
      WG_TILE_K: 32
      SG_GRID_X: 2
      SG_GRID_Y: 4
      SUBGROUP_SIZE: 32
    - NAME: sarc_linear_q4gsw_coopmat_sweep_t128x128k32g42s32f32_buffer_texture2d_half
