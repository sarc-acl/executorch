# SARC development zone, Jetson Orin (sarc-1.5-orin-fused-port): fused LLM-mode prefill SDPA, one subgroup of 32 per
# workgroup (the 780M's third structure with the RX 7600's subgroup barriers). Not shipped; reached only through
# impl/sarc_dev/orin/SdpaOrinFused.cpp and the release-zone entry point Override::sdpa_fused_*.
# Name: d<HEAD_DIM>_t<WG_TILE_M>x<WG_TILE_N>g11s32r[k][o]; r = AQ_REG (Q tiles kept in registers), k = PACKED
# (tile-packed K and V copies), o = ONLINE (one pass, running row maximum).
# Each variant needs WG_TILE_M 16 or 32 (two or one invocations per row of the subgroup) and
# WG_TILE_N / (32 / WG_TILE_M) a multiple of 8.
# rko: candidate 1 (profile orin-fused1). ro: the unpacked one-pass form (candidate 2 if the copy passes cost more
# than they save). rk / r: the two-pass forms, kernel-level timing only.

sarc_dev_orin_sdpa_fused3sb:
  parameter_names_with_default_values:
    DTYPE: half
    PRECISION: highp
    IO_STORAGE: buffer
    K_CACHE_STORAGE: buffer
    HEAD_DIM: 64
    WG_TILE_M: 32
    WG_TILE_N: 32
    SUBGROUP_SIZE: 32
    AQ_REG: false
    PACKED: false
    ONLINE: false
    ONE_PASS_WRONG: false
  generate_variant_forall:
    combination:
      parameter_names: [IO_STORAGE, K_CACHE_STORAGE]
      combos:
        - parameter_values: [buffer, buffer]
    DTYPE:
      - VALUE: half
  shader_variants:
    - NAME: sarc_dev_orin_sdpa_fused3sb_d64_t32x32g11s32rko
      HEAD_DIM: 64
      WG_TILE_M: 32
      WG_TILE_N: 32
      SUBGROUP_SIZE: 32
      AQ_REG: true
      PACKED: true
      ONLINE: true
    - NAME: sarc_dev_orin_sdpa_fused3sb_d64_t32x32g11s32ro
      HEAD_DIM: 64
      WG_TILE_M: 32
      WG_TILE_N: 32
      SUBGROUP_SIZE: 32
      AQ_REG: true
      PACKED: false
      ONLINE: true
    - NAME: sarc_dev_orin_sdpa_fused3sb_d64_t32x32g11s32rk
      HEAD_DIM: 64
      WG_TILE_M: 32
      WG_TILE_N: 32
      SUBGROUP_SIZE: 32
      AQ_REG: true
      PACKED: true
      ONLINE: false
    - NAME: sarc_dev_orin_sdpa_fused3sb_d64_t32x32g11s32r
      HEAD_DIM: 64
      WG_TILE_M: 32
      WG_TILE_N: 32
      SUBGROUP_SIZE: 32
      AQ_REG: true
      PACKED: false
      ONLINE: false
    - NAME: sarc_dev_orin_sdpa_fused3sb_d128_t16x64g11s32rko
      HEAD_DIM: 128
      WG_TILE_M: 16
      WG_TILE_N: 64
      SUBGROUP_SIZE: 32
      AQ_REG: true
      PACKED: true
      ONLINE: true
    - NAME: sarc_dev_orin_sdpa_fused3sb_d128_t16x64g11s32ro
      HEAD_DIM: 128
      WG_TILE_M: 16
      WG_TILE_N: 64
      SUBGROUP_SIZE: 32
      AQ_REG: true
      PACKED: false
      ONLINE: true
    - NAME: sarc_dev_orin_sdpa_fused3sb_d128_t16x64g11s32rk
      HEAD_DIM: 128
      WG_TILE_M: 16
      WG_TILE_N: 64
      SUBGROUP_SIZE: 32
      AQ_REG: true
      PACKED: true
      ONLINE: false
    - NAME: sarc_dev_orin_sdpa_fused3sb_d128_t16x64g11s32r
      HEAD_DIM: 128
      WG_TILE_M: 16
      WG_TILE_N: 64
      SUBGROUP_SIZE: 32
      AQ_REG: true
      PACKED: false
      ONLINE: false
