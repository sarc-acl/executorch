# SARC development zone, RTX 4070 Ti SUPER (openspec/changes/sarc-1.5-4070ti-fused-port): tile-packed copies of
# the K and V caches for sarc_dev_4070ti_sdpa_fused3sb (not shipped; the 780M's sarc_dev_780m_sdpa_kvt).

