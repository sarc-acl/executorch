# SARC development zone, 780M: single-load variant with the zero fill bounded to what the SARC attn*V kernels read, of sarc_sdpa_attn_weights_softmax (not shipped, not
# reachable without the hook described in openspec/changes/sarc-1.5-780m-prefill-refine/hooks/).

sarc_sdpa_attn_weights_softmax_780m_r3:
  parameter_names_with_default_values:
    IN_DTYPE: float
    OUT_DTYPE: float
    STORAGE: texture3d
    MODE: llm
  generate_variant_forall:
    STORAGE:
      - VALUE: texture3d
      - VALUE: buffer
    combination:
      parameter_names: [IN_DTYPE, OUT_DTYPE]
      combos:
        - parameter_values: [float, float]
          suffix: float
        - parameter_values: [half, half]
          suffix: half
  shader_variants:
    - NAME: sarc_sdpa_attn_weights_softmax_780m_r3
