# KHR Cooperative Matrix SDPA QK^T kernel (prefill / LLM). Buffer-only, fp16.
# Variant name matches the dispatch:
# sdpa_compute_attn_weights_coopmat_buffer_buffer_half.

sdpa_compute_attn_weights_coopmat:
  parameter_names_with_default_values:
    DTYPE: half
    PRECISION: highp
    IO_STORAGE: buffer
    K_CACHE_STORAGE: buffer
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    # 128x64 is the tile-sweep optimum that FITS this shader's shared memory
    # (the generic-matmul sweep's 128x128 needs ~50KB LDS once the causal-mask
    # Csh scratch is added — overflows M5 EVT1). M-tile 128, N-tile 64.
    WG_TILE_M: 128
    WG_TILE_N: 64
    WG_TILE_K: 32
    SG_GRID_X: 2
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 64
  generate_variant_forall:
    combination:
      parameter_names: [IO_STORAGE, K_CACHE_STORAGE]
      combos:
        - parameter_values: [buffer, buffer]
    DTYPE:
      - VALUE: half
  shader_variants:
    - NAME: sdpa_compute_attn_weights_coopmat
