# SARC release zone: shipped zpgtr variants (rows in impl/sarc/table_<vendor>.cpp).


sarc_linear_dq8ca_coopmat_zpgtr:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    IO_STORAGE: buffer
    WEIGHT_NBITS: 4
    WEIGHT_STORAGE: texture2d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 128
    WG_TILE_N: 64
    WG_TILE_K: 32
    SG_GRID_X: 4
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 32
    A_RAW: false
    B_PAIR: false
    CSH_IN_ASH: false
  shader_variants:
    # RTX 4070 Ti SUPER and Jetson Orin: MMA 16x16x32, K 64, raw A staging,
    # paired B. 1.4 branches -4070ti/-jetson.
    - NAME: sarc_linear_dq8ca_coopmat_zpgtr_t128x128k64g44s32mk32ra_buffer_texture2d_half
      WG_TILE_N: 128
      WG_TILE_K: 64
      SG_GRID_X: 4
      SG_GRID_Y: 4
      MMA_K: 32
      A_RAW: true
      B_PAIR: true
    - NAME: sarc_linear_dq8ca_coopmat_zpgtr_t128x128k64g44s32mk32ra_texture3d_texture2d_half
      IO_STORAGE: texture3d
      CSH_IN_ASH: true
      WG_TILE_N: 128
      WG_TILE_K: 64
      SG_GRID_X: 4
      SG_GRID_Y: 4
      MMA_K: 32
      A_RAW: true
      B_PAIR: true
    # Samsung Xclipse (M51): the 1.4 dev branch default.
    - NAME: sarc_linear_dq8ca_coopmat_zpgtr_t128x64k32g42s32_buffer_texture2d_half
    - NAME: sarc_linear_dq8ca_coopmat_zpgtr_t128x64k32g42s32_texture3d_texture2d_half
      IO_STORAGE: texture3d
