# SARC release zone: shipped variants only. Each variant is referenced by a
# row in impl/sarc/table_<vendor>.cpp. Candidates live in
# glsl/sarc_dev/sarc_linear_q4gsw_coopmat_sweep.yaml; promotion moves a block
# from there to here (renamed) together with its table row and golden SPIR-V
# hash (sarc/golden/spirv.json).

sarc_linear_q4gsw_coopmat:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    IO_STORAGE: buffer
    WEIGHT_STORAGE: texture2d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 128
    WG_TILE_N: 128
    WG_TILE_K: 32
    SG_GRID_X: 4
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 32
    ACC_FP32: false
    CSH_IN_ASH: false
  shader_variants:
    # Radeon 780M (RDNA3, RADV). fp32 accumulate ('f32') and the texture3d
    # drain staged in Ash ('c'). 1.4 study: igpu-roofline docs/780M-WMMA-LESSONS.md.
    - NAME: sarc_linear_q4gsw_coopmat_t128x128k32g42s32f32c_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_STORAGE: texture2d
      ACC_FP32: true
      CSH_IN_ASH: true
    - NAME: sarc_linear_q4gsw_coopmat_t128x128k32g42s32f32c_buffer_texture2d_half
      WEIGHT_STORAGE: texture2d
      ACC_FP32: true
      CSH_IN_ASH: true
    - NAME: sarc_linear_q4gsw_coopmat_t128x128k32g42s32f32c_buffer_buffer_half
      WEIGHT_STORAGE: buffer
      ACC_FP32: true
      CSH_IN_ASH: true
