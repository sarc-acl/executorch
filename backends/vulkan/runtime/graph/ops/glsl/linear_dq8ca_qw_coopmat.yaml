# coopmat<int8> x coopmat<int8> -> coopmat<int32> variant of the
# dynamically-quantized-activation linear tiled shader (INT4 group-symmetric
# weight).
#   WEIGHT_NBITS=4 -> linear_dq8ca_q4gsw_coopmat (INT4 group-symmetric)
# Requires the VK_COMPONENT_TYPE_SINT8_KHR cooperative matrix property to be
# enumerated on the device.
# specs/027-e2e-tile-sweep: tile geometry updated from 128x64/K32/2x2 to
# 64x32/K32/1x2 (specs/027's e2e-ranked sweep winner, +9.32% confirmed real
# end-to-end prefill throughput vs the prior geometry, not just isolated
# microbenchmark GFLOP/s). SUBGROUP_SIZE stays 64: specs/026 found
# subgroup=32 is legal (no compiler crash) but sharply tile-shape-dependently
# incorrect, and this tile shape was not verified correct at subgroup=32 --
# see specs/026-8da4w-subgroup32-sweep/results/ before considering it.

linear_dq8ca_qw_coopmat:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    WEIGHT_NBITS: 4
    WEIGHT_STORAGE: texture2d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 64
    WG_TILE_N: 128
    WG_TILE_K: 32
    SG_GRID_X: 4
    SG_GRID_Y: 1
    SUBGROUP_SIZE: 32
  shader_variants:
    - NAME: linear_dq8ca_q4gsw_coopmat_buffer_texture2d_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
    - NAME: linear_dq8ca_q4gsw_coopmat_buffer_buffer_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: buffer
