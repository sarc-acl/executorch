# coopmat<int8> x coopmat<int8> -> coopmat<int32> variant of the
# dynamically-quantized-activation linear tiled shader (INT4 group-symmetric
# weight).
#   WEIGHT_NBITS=4 -> linear_dq8ca_q4gsw_coopmat (INT4 group-symmetric)
# Requires the VK_COMPONENT_TYPE_SINT8_KHR cooperative matrix property to be
# enumerated on the device.
# IO_STORAGE selects activation/output storage: "buffer" uses coopMatStore
# directly on an SSBO; "texture3d" stages the result tile through shared
# memory before an imageStore.
# Geometry: 128x64 tile, K-step 32, 4x2 subgroid grid x 32 threads (subgroup
# size 32 forced). An earlier, simpler A-staging scheme could not be forced to
# subgroup 32 for int8 WMMA (the Xclipse PAL compiler crashed in
# vkCreateComputePipelines) and needed subgroup 64 instead; this shader's
# coopMat-mediated A staging (coopMatLoad(global) -> coopmat<> ->
# coopMatStore(LDS), rather than a per-thread scalar scatter) does not hit
# that compiler bug, so it runs at wave32 like the fp16 kernel
# (linear_qw_coopmat).

linear_dq8ca_qw_coopmat:
  parameter_names_with_default_values:
    PRECISION: highp
    HAS_BIAS: false
    IO_STORAGE: buffer
    WEIGHT_NBITS: 4
    WEIGHT_STORAGE: texture2d
    MMA_M: 16
    MMA_N: 16
    MMA_K: 16
    WG_TILE_M: 128
    WG_TILE_N: 64
    WG_TILE_K: 32
    SG_GRID_X: 4
    SG_GRID_Y: 2
    SUBGROUP_SIZE: 32
  shader_variants:
    - NAME: linear_dq8ca_q4gsw_coopmat_buffer_texture2d_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
    - NAME: linear_dq8ca_q4gsw_coopmat_texture3d_texture2d_half
      IO_STORAGE: texture3d
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: texture2d
    - NAME: linear_dq8ca_q4gsw_coopmat_buffer_buffer_half
      WEIGHT_NBITS: 4
      WEIGHT_STORAGE: buffer
